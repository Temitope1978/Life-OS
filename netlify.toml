# Netlify deployment configuration for Life OS.
#
# The site's base directory is `sim`. During a Netlify build the
# command below generates the same browser-safe runtime config
# (assets/js/env.js) that the GitHub Pages workflow produces,
# using the SUPABASE_URL and SUPABASE_ANON_KEY environment
# variables supplied in the Netlify UI. Only the publishable
# anon key is ever written; service-role, database, and JWT
# credentials are never used. The generated assets/js/env.js is
# gitignored and is never committed — no secret value is stored
# in this repository.

[build]
  # Run the build from the `sim` directory.
  base = "sim"
  # Publish the `sim` directory itself (relative to the base dir).
  publish = "."
  # Generate the runtime environment file with plain Node.js (works on
  # Windows for the local Netlify CLI and on Netlify's Linux builders —
  # the previous Bash heredoc failed on Windows). The script reads
  # SUPABASE_URL / SUPABASE_ANON_KEY, validates them, enforces the
  # server-secret guard, syntax-checks the output, and only then writes
  # assets/js/env.js. Any failure exits non-zero and fails the deploy.
  command = "node ../scripts/netlify-env.js"

[build.environment]
  # The generated browser config (sim/assets/js/env.js) intentionally
  # contains only the browser-safe anon key. Omit it from Netlify's
  # secrets scanner so the build is not flagged, while scanning stays
  # enabled for everything else.
  SECRETS_SCAN_OMIT_PATHS = "sim/assets/js/env.js"
  # SUPABASE_URL and SUPABASE_ANON_KEY are browser-safe (public project
  # URL and publishable anon key), not server secrets. Omit them by key
  # name so the scanner does not flag their values wherever they appear;
  # path-based omission proved unreliable with base = "sim".
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY"
