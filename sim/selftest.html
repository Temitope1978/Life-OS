<script>

(function () {
  var lines = [], fails = 0;
  function ok(name, cond, extra) {
    if (!cond) fails++;
    lines.push((cond ? 'PASS ' : 'FAIL ') + name + (extra ? ' :: ' + extra : ''));
  }
  function tryRun(name, fn) {
    try { var v = fn(); lines.push('RUN  ' + name + ' :: ' + v); return v; }
    catch (e) {
      fails++;
      lines.push('THROW ' + name + ' :: ' + e.message);
      lines.push('      ' + String(e.stack || '').split('\n').slice(0, 4).join(' | '));
      return null;
    }
  }

  /* ---------- Finalization ----------
     The synchronous suite settles immediately, but the
     production-adapter contract tests (below) are async.
     `finish` renders the summary exactly once, whether
     the async tests settle or the safety timeout fires. */
  var finalized = false;
  function finish() {
    if (finalized) return;
    finalized = true;
    lines.push('---');
    lines.push(fails === 0 ? 'ALL PASS' : (fails + ' FAILURE(S)'));
    document.getElementById('out').textContent = lines.join('\n');
    var bar = document.getElementById('bar');
    bar.textContent = fails === 0 ? 'All checks passed' : fails + ' check(s) failed';
    bar.className = 'bar ' + (fails === 0 ? 'ok' : 'bad');
  }

  /* ---------- Mock Supabase client (TEST ONLY) ----------
     A clearly-marked in-memory stand-in for the official
     Supabase client. It is NOT a real Supabase response
     and is never shipped: it exists only to exercise the
     SupabaseAuthAdapter's contract (session shape, profile
     fact reading, fail-closed sign-in, sign-out) without
     network access or credentials. Never fake a real
     production sign-in with this — real sign-up, sign-in,
     session restoration, the new-user trigger and RLS are
     verified against a real Supabase project only. */
  function makeMockSupabase() {
    var users = {}, profiles = {}, sessions = {};
    var currentUserId = null;
    var seq = 0;
    var queried = {};   /* every table the adapter queries */

    function userRecord(id, email, name) {
      return {
        id: id, email: email, created_at: '2026-01-01T00:00:00Z',
        user_metadata: { full_name: name },
        raw_user_meta_data: { full_name: name }
      };
    }

    /* A profile row shaped EXACTLY like the existing
       public.profiles table (supabase/migrations/
       20261001000001_schema.sql): user_id, name, email,
       timezone, subscription, preferences, created_at.
       It deliberately has NO display_name and NO avatar_url
       column, so any adapter that referenced them would read
       undefined and fail the shape assertions below. */
    function profileRow(id, name, email, timezone, subscription) {
      return {
        user_id: id, name: name, email: email,
        timezone: timezone || 'Europe/London',
        subscription: subscription || 'free',
        preferences: {}, created_at: '2026-01-01T00:00:00Z'
      };
    }

    var client = {
      /* Test-only seeding helpers (the adapter ignores them). */
      _seedUser: function (email, profileName) {
        var id = 'mock-user-' + (++seq);
        /* user_metadata.full_name is deliberately a DIFFERENT value
           from the profile.name column, so the tests can prove the
           adapter reads the existing profile.name column and does not
           fall back to the auth metadata. */
        users[id] = userRecord(id, email, 'Metadata ' + profileName);
        profiles[id] = profileRow(id, profileName, email, 'Europe/Oslo', 'free');
        sessions[id] = {
          user: users[id], expires_at: '2026-12-31T00:00:00Z',
          created_at: '2026-01-01T00:00:00Z', access_token: 'MOCK-TOKEN-' + id
        };
        return id;
      },
      _setCurrent: function (id) { currentUserId = id; },
      _queried: function () { return Object.keys(queried); },

      auth: {
        getSession: function () {
          return Promise.resolve({ data: { session: currentUserId ? sessions[currentUserId] : null } });
        },
        getUser: function () {
          return Promise.resolve({ data: { user: currentUserId ? users[currentUserId] : null } });
        },
        signInWithPassword: function (creds) {
          var found = null;
          Object.keys(users).forEach(function (k) { if (users[k].email === creds.email) found = k; });
          /* single hardcoded test password, as Supabase would verify server-side */
          if (!found || creds.password !== 'correct-password') {
            return Promise.resolve({ data: {}, error: { message: 'Invalid login credentials' } });
          }
          currentUserId = found;
          return Promise.resolve({ data: { session: sessions[found], user: users[found] } });
        },
        signUp: function (params) {
          var exists = Object.keys(users).some(function (k) { return users[k].email === params.email; });
          if (exists) return Promise.resolve({ data: {}, error: { message: 'User already registered' } });
          var id = 'mock-user-' + (++seq);
          var name = (params.options && params.options.data && params.options.data.full_name) || 'New User';
          users[id] = userRecord(id, params.email, name);
          /* Mimic the EXISTING handle_new_user() trigger (migration
             20261001000003_rls.sql): it creates ONLY a profiles row,
             with name from the signup metadata, the user's email, a
             default timezone and a default subscription. It creates no
             permissions and no autonomy. The adapter must work with
             exactly this shape. */
          profiles[id] = profileRow(id, name, params.email, 'Europe/London', 'free');
          sessions[id] = { user: users[id], expires_at: '2026-12-31T00:00:00Z', created_at: '2026-01-01T00:00:00Z' };
          currentUserId = id;
          return Promise.resolve({ data: { session: sessions[id], user: users[id] } });
        },
        signOut: function () { currentUserId = null; return Promise.resolve({}); },
        onAuthStateChange: function () { return { data: { subscription: { unsubscribe: function () {} } } }; }
      },

      /* The adapter calls client.from(table).select(...).eq(...).
         Every table it queries is recorded so the tests can prove the
         adapter reads ONLY the existing public.profiles table and
         never the nonexistent user_preferences / granted_permissions. */
      from: function (table) {
        queried[table] = true;
        return {
          select: function () {
            return {
              eq: function (col, val) {
                var rows = (table === 'profiles' && profiles[val]) ? [profiles[val]] : [];
                return {
                  then: function (onFulfilled, onRejected) {
                    return Promise.resolve({ data: rows }).then(onFulfilled, onRejected);
                  },
                  single: function () { return Promise.resolve({ data: rows[0] || null }); }
                };
              }
            };
          }
        };
      }
    };
    return client;
  }

  /* ---------- Production adapter tests (async) ----------
     Run after the synchronous suite. The fail-closed
     bootstrap is exercised against the real config path
     (production mode with no Supabase client present);
     the adapter contract is exercised against the mock
     above. The demo adapter and default config are
     restored at the end so the selftest ends exactly as
     it started. */
  function productionAuthTests() {
    var originalAdapter = window.Session.getAdapter();
    /* Shared across the async steps so every step can inspect
       the mock (which tables the adapter queried). */
    var mock;

    return Promise.resolve()
      /* Fail-closed: production mode on, no Supabase client. */
      .then(function () {
        window.Config.load({
          LIFEOS_MODE: 'live',
          SUPABASE_URL: 'https://example.supabase.co',
          SUPABASE_ANON_KEY: 'anon-key'
        });
        return window.SupabaseAuth.bootstrap();
      })
      .then(function () {
        ok('production bootstrap() fails closed to the misconfigured adapter when the client is absent',
           window.Session.getAdapter().id === 'misconfigured' &&
           window.Session.getAdapter().misconfigured === true);
        ok('misconfigured adapter reports not authenticated',
           window.Session.isAuthenticated() === false);
        ok('misconfigured adapter allows public routes and blocks protected routes',
           window.Session.requireAuth('/welcome') === true &&
           window.Session.requireAuth('/command') === false);
        return window.Session.signIn({ email: 'a@b.co', password: 'x' });
      })
      .then(function (r) {
        ok('misconfigured adapter sign-in fails closed with a clear error (never falls back to demo)',
           r.ok === false && r.errors && /not configured/i.test(r.errors[0] || ''));
        return window.Session.signOut();
      })

      /* Adapter contract against the mock client. */
      .then(function () {
        mock = makeMockSupabase();
        var uid = mock._seedUser('test@lifeos.test', 'Test Person');
        mock._setCurrent(uid);
        var adapter = window.SupabaseAuth.SupabaseAuthAdapter.create(mock);
        window.Session.setAdapter(adapter);
        return adapter.restore();
      })
      .then(function () {
        var u = window.Session.currentUser();
        ok('restored production session is authenticated',
           window.Session.isAuthenticated() === true);
        ok('production user shape uses the existing profiles schema (name/email/timezone/subscription from DB)',
           !!(u && u.demo === false && u.userId && u.name === 'Test Person' &&
              u.email === 'test@lifeos.test' && u.authState === 'supabase' &&
              u.timezone === 'Europe/Oslo' && u.subscription === 'free'));
        ok('production user does not fabricate app-layer facts (autonomy/permissions/learnedPrefs are undefined — not in the schema)',
           !!(u && u.autonomy === undefined && u.permissions === undefined && u.learnedPrefs === undefined));
        ok('adapter reads the existing public.profiles table',
           mock._queried().indexOf('profiles') !== -1);
        ok('adapter does not query the nonexistent user_preferences table',
           mock._queried().indexOf('user_preferences') === -1);
        ok('adapter does not query the nonexistent granted_permissions table',
           mock._queried().indexOf('granted_permissions') === -1);
        ok('adapter reads profile.name, not display_name (the seeded row has no display_name column; the metadata fallback value differs)',
           window.Session.currentUser().name === 'Test Person');
        ok('production session object carries identity but never the raw access token',
           (function () {
             var s = window.Session.session();
             return !!s && s.demo === false && s.userId &&
                    s.access_token === undefined && s.accessToken === undefined;
           })());
        ok('production adapter allows protected and public routes when signed in',
           window.Session.requireAuth('/command') === true &&
           window.Session.requireAuth('/welcome') === true);
        return window.Session.signOut();
      })
      .then(function () {
        ok('production sign-out clears the session and the current user',
           window.Session.isAuthenticated() === false && window.Session.currentUser() === null);
        return window.Session.signIn({ email: 'test@lifeos.test', password: 'correct-password' });
      })
      .then(function (r) {
        ok('production sign-in with the correct password authenticates',
           r.ok === true && window.Session.isAuthenticated() === true &&
           window.Session.currentUser().name === 'Test Person');
        return window.Session.signOut();
      })
      .then(function () {
        /* Wrong password on a fresh adapter must fail closed. */
        mock = makeMockSupabase();
        mock._seedUser('test@lifeos.test', 'Test Person');
        var adapter = window.SupabaseAuth.SupabaseAuthAdapter.create(mock);
        window.Session.setAdapter(adapter);
        return adapter.signIn({ email: 'test@lifeos.test', password: 'wrong-password' });
      })
      .then(function (r) {
        ok('production sign-in with a wrong password fails closed (not authenticated, clear error)',
           r.ok === false && window.Session.isAuthenticated() === false &&
           r.errors && /invalid email or password/i.test(r.errors[0] || ''));
        return window.Session.signUp({
          name: 'New Person', email: 'new@lifeos.test',
          password: 'correct-password', confirm: 'correct-password'
        });
      })
      .then(function (r) {
        ok('production sign-up creates the account and signs the user in',
           r.ok === true && window.Session.isAuthenticated() === true &&
           window.Session.currentUser().name === 'New Person' &&
           window.Session.currentUser().email === 'new@lifeos.test' &&
           window.Session.currentUser().demo === false);
        ok('existing signup-trigger compatibility: the profile created on signup carries the name from metadata and no fabricated permissions/autonomy',
           window.Session.currentUser().name === 'New Person' &&
           window.Session.currentUser().timezone === 'Europe/London' &&
           window.Session.currentUser().subscription === 'free' &&
           window.Session.currentUser().autonomy === undefined &&
           window.Session.currentUser().permissions === undefined);
      })
      .then(function () {
        /* Restore the demo adapter + default config so the
           selftest ends exactly as it started. */
        window.Config.load();
        window.Session.setAdapter(originalAdapter);
        ok('demo adapter is restored after the production adapter tests',
           window.Session.getAdapter() === originalAdapter &&
           window.Session.getAdapter().id === 'demo');
      });
  }

  /* ---------- Deployment configuration wiring tests (async) ----------
     Verify the deploy-time configuration path: config.js reads the
     injected window.__LIFEOS_ENV__, the browser-safe configuration
     is exactly the three public values, and server-only secrets are
     never surfaced. These tests mutate the injected environment and
     the config, then restore them so the selftest ends exactly as
     it started. They deliberately do NOT re-invoke bootstrap(): the
     bootstrap promise is intentionally cached (idempotent boot) and
     is already exercised by productionAuthTests above. */
  function deploymentConfigWiringTests() {
    /* Captured before any mutation: the selftest page must NOT load
       a real env.js, so the injected environment is absent by default
       and the page starts in demo mode. */
    var hadInjectedEnv = (typeof window.__LIFEOS_ENV__ !== 'undefined');

    return Promise.resolve()
      .then(function () {
        ok('the selftest page loads no env.js and starts in demo mode (window.__LIFEOS_ENV__ is undefined)',
           hadInjectedEnv === false &&
           window.Config.isEmpty() === true &&
           window.SupabaseAuth.mode() === 'demo' &&
           window.SupabaseAuth.isProductionMode() === false);
      })
      /* config.js reads the REAL runtime injection path
         (window.__LIFEOS_ENV__), not the test-only
         Config.load(overrides) used elsewhere in this suite. */
      .then(function () {
        window.__LIFEOS_ENV__ = {
          LIFEOS_MODE: 'live',
          SUPABASE_URL: 'https://example.supabase.co',
          SUPABASE_ANON_KEY: 'test-anon-key-123'
        };
        window.Config.load();   /* no-argument load reads window.__LIFEOS_ENV__ */
        ok('config.js reads the injected window.__LIFEOS_ENV__ object',
           window.Config.get('LIFEOS_MODE') === 'live' &&
           window.Config.get('SUPABASE_URL') === 'https://example.supabase.co' &&
           window.Config.get('SUPABASE_ANON_KEY') === 'test-anon-key-123');
        ok('config exposes only key names and lengths, never secret values',
           window.Config.mask('SUPABASE_ANON_KEY') === 'set · 17 chars' &&
           window.Config.mask('SUPABASE_URL') === 'set · 27 chars');
        ok('the browser-safe production configuration is exactly LIFEOS_MODE, SUPABASE_URL and SUPABASE_ANON_KEY',
           window.SupabaseAuth.isProductionMode() === true &&
           window.SupabaseAuth.isConfigured() === true);
      })
      /* Even if server-only secrets are (wrongly) present in the
         environment, the config layer never surfaces their values and
         the adapter's "configured" check depends only on the two
         public keys. */
      .then(function () {
        window.__LIFEOS_ENV__ = {
          LIFEOS_MODE: 'live',
          SUPABASE_URL: 'https://example.supabase.co',
          SUPABASE_ANON_KEY: 'test-anon-key-123',
          SUPABASE_SERVICE_ROLE_KEY: 'SRV-SECRET-MUST-NOT-SURFACE',
          SUPABASE_DB_URL: 'postgresql://postgres:DB-SECRET@db.example.supabase.co:5432/postgres',
          SUPABASE_DB_PASSWORD: 'DB-PASSWORD-SECRET',
          JWT_SECRET: 'JWT-SECRET',
          GOOGLE_CLIENT_SECRET: 'OAUTH-CLIENT-SECRET'
        };
        window.Config.load();
        ok('server-only secrets present in the environment are never surfaced as values (mask reveals length only)',
           window.Config.mask('SUPABASE_SERVICE_ROLE_KEY') === 'set · 27 chars' &&
           window.Config.mask('SUPABASE_DB_PASSWORD') === 'set · 18 chars' &&
           window.Config.mask('JWT_SECRET') === 'set · 10 chars');
        ok('isConfigured() depends only on the two public Supabase keys, not on any server-only secret',
           window.SupabaseAuth.isConfigured() === true);
        /* A temporary adapter (NOT installed as the session adapter)
           proves the adapter derives its storage key from the public
           URL only, never from a server-only secret. */
        var adapter = window.SupabaseAuth.SupabaseAuthAdapter.create(makeMockSupabase());
        ok('the adapter derives its storage key from the public SUPABASE_URL only, never from a server-only secret',
           adapter.storageKey() === 'sb-example-auth-token');
      })
      /* A production configuration missing a PUBLIC key is not
         configured (fails closed) even when server-only secrets are
         present — the adapter never treats a server-only key as
         sufficient configuration. */
      .then(function () {
        window.__LIFEOS_ENV__ = {
          LIFEOS_MODE: 'live',
          SUPABASE_SERVICE_ROLE_KEY: 'SRV-SECRET-MUST-NOT-SURFACE'
        };
        window.Config.load();
        ok('production mode with a missing public key is not configured (fails closed) even if server-only secrets are present',
           window.SupabaseAuth.isProductionMode() === true &&
           window.SupabaseAuth.isConfigured() === false);
      })
      .then(function () {
        /* Restore the injected environment and the default config so
           the selftest ends exactly as it started. */
        delete window.__LIFEOS_ENV__;
        window.Config.load();
        ok('default demo configuration is restored after the wiring tests',
           window.Config.isEmpty() === true &&
           window.SupabaseAuth.isProductionMode() === false &&
           window.Session.getAdapter().id === 'demo');
      });
  }

  try {
    ok('window.SEED', !!window.SEED);
    ok('window.D', !!window.D, 'today=' + window.D.today());
    ok('window.Store', !!window.Store);
    ok('window.App', !!window.App);

    /* app.js defers boot to DOMContentLoaded, which has not fired inside this
       inline script ΓÇö boot explicitly, then assert the shell rendered. */
    tryRun('boot render', function () {
      window.App.boot();
      return document.getElementById('view').children.length + ' blocks';
    });
    ok('view rendered', document.getElementById('view').children.length > 0,
       document.getElementById('view').children.length + ' children');

    /* ============================================================
       Demo authentication (assessment-safe). A clearly-labelled
       DEMO sign-in/sign-up layer — NOT real auth. No password is
       stored anywhere; it is validated in memory only. Supabase
       Auth is NOT activated. A demo session is established here so
       the downstream route loop (below) renders every real view. */
    var TEST_PW = 'Demo' + 'Password' + '123!';

    tryRun('welcome screen loads', function () {
      window.location.hash = '#/welcome';
      window.App.render();
      var root = document.getElementById('view');
      return root.children.length + ' blocks';
    });
    ok('welcome screen loads with branding, Sign In, Create Account and demo note',
       (function () {
         var t = document.getElementById('view').textContent;
         return t.indexOf('AI Life OS') !== -1 &&
                t.indexOf('Your Personal AI Chief of Staff') !== -1 &&
                t.indexOf('Remember less. Organize less. Get more done.') !== -1 &&
                t.indexOf('Sign In') !== -1 &&
                t.indexOf('Create Account') !== -1 &&
                t.indexOf('Continue as Demo') !== -1 &&
                t.indexOf('Demo Environment') !== -1;
       })());

    tryRun('sign in screen loads', function () {
      window.location.hash = '#/signin';
      window.App.render();
      return document.getElementById('view').children.length + ' blocks';
    });
    ok('sign in screen loads with email + password fields and demo note',
       (function () {
         var root = document.getElementById('view');
         var types = Array.prototype.map.call(root.querySelectorAll('input'), function (i) { return i.type; });
         return types.indexOf('email') !== -1 && types.indexOf('password') !== -1 &&
                root.textContent.indexOf('Sign In') !== -1 &&
                root.textContent.indexOf('Demo Environment') !== -1;
       })());

    tryRun('sign up screen loads', function () {
      window.location.hash = '#/signup';
      window.App.render();
      return document.getElementById('view').children.length + ' blocks';
    });
    ok('sign up screen loads with name, email, password, confirm and demo note',
       (function () {
         var root = document.getElementById('view');
         var types = Array.prototype.map.call(root.querySelectorAll('input'), function (i) { return i.type; });
         var emails = types.filter(function (t) { return t === 'email'; }).length;
         var pws = types.filter(function (t) { return t === 'password'; }).length;
         var labels = Array.prototype.map.call(root.querySelectorAll('label'), function (l) { return l.textContent; });
         return emails === 1 && pws === 2 &&
                labels.indexOf('Full Name') !== -1 &&
                labels.indexOf('Email Address') !== -1 &&
                labels.indexOf('Password') !== -1 &&
                labels.indexOf('Confirm Password') !== -1 &&
                root.textContent.indexOf('Create Account') !== -1 &&
                root.textContent.indexOf('Demo Environment') !== -1;
       })());

    /* Validation: required fields, email format, password match, min length. */
    ok('sign up validation: required fields are enforced',
       (function () {
         var r = window.DemoAuth.validateSignUp({ name: '', email: '', password: '', confirm: '' });
         return !r.ok && r.errors.length >= 4;
       })());
    ok('sign up validation: invalid email is rejected',
       (function () {
         var r = window.DemoAuth.validateSignUp({ name: 'A B', email: 'not-an-email', password: TEST_PW, confirm: TEST_PW });
         return !r.ok && r.errors.some(function (e) { return /valid email/i.test(e); });
       })());
    ok('sign up validation: password confirmation mismatch is rejected',
       (function () {
         var r = window.DemoAuth.validateSignUp({ name: 'A B', email: 'a@b.co', password: TEST_PW, confirm: 'Different' + 'Password' + '123!' });
         return !r.ok && r.errors.some(function (e) { return /do not match/i.test(e); });
       })());
    ok('sign up validation: short password is rejected',
       (function () {
         var r = window.DemoAuth.validateSignUp({ name: 'A B', email: 'a@b.co', password: 'short', confirm: 'short' });

           function (b) { return b.textContent; });
         var expected = ['In Progress', 'Waiting', 'Completed']
           .filter(function (s) { return s !== t.status; });
         return txt.indexOf(t.title) !== -1 && txt.indexOf(t.status) !== -1 &&
                labels.indexOf('Edit') !== -1 &&
                expected.some(function (s) { return labels.indexOf(s) !== -1; });
       })());

    tryRun('commitment detail modal shows full content', function () {
      window.$.clear(document.getElementById('modal-root'));
      window.Details.open({ kind: 'commitment', ref: 'k1' });
      return document.getElementById('modal-root').textContent.slice(0, 160);
    });
    ok('commitment detail shows description, direction, person and due date',
       (function () {
         var txt = document.getElementById('modal-root').textContent;
         var k = window.Store.commitment('k1');
         var p = window.Store.contact(k.personId);
         return txt.indexOf(k.description) !== -1 &&
                txt.indexOf(window.EnginesCommitment.directionLabel(k.direction)) !== -1 &&
                txt.indexOf(p.name) !== -1 &&
                (k.dueDate ? txt.indexOf(window.D.formatDate(k.dueDate)) !== -1 : true);
       })());

    /* The calendar view renders a true month grid anchored to the
       (pinned) real local date, with today highlighted and event
       dots on the authored event dates. */
    window.D.setRealToday('2026-09-22');
    tryRun('calendar view renders a real month grid', function () {
      window.$.clear(document.getElementById('modal-root'));
      window.DemoAuth.continueDemo();
      window.location.hash = '#/calendar';
      window.App.render();
      var root = document.getElementById('view');
      var grid = root.querySelectorAll('.cal-grid .cal-cell').length;
      var wds = root.querySelectorAll('.cal-week .cal-wd').length;
      var title = root.querySelector('.cal-title');
      return 'cells=' + grid + ' weekdayHeaders=' + wds +
             ' title=' + (title ? title.textContent : 'NONE') +
             ' todayCells=' + root.querySelectorAll('.cal-cell.today').length +
             ' evDots=' + root.querySelectorAll('.cal-dot.ev').length;
    });
    ok('calendar renders the demo month (September 2026) with today highlighted and event dots',
       (function () {
         var root = document.getElementById('view');
         var title = root.querySelector('.cal-title');
         return !!title && title.textContent === 'September 2026' &&
                root.querySelectorAll('.cal-cell.today').length === 1 &&
                root.querySelectorAll('.cal-week .cal-wd').length === 7 &&
                root.querySelectorAll('.cal-dot.ev').length >= 3;
       })(),
       (function () { var t = document.querySelector('.cal-title'); return t ? t.textContent : 'NONE'; })());

    tryRun('calendar day click selects the day and shows its agenda', function () {
      var root = document.getElementById('view');
      var cells = Array.prototype.filter.call(
        root.querySelectorAll('.cal-cell'),
        function (c) {
          var dn = c.querySelector('.cal-dn');
          return dn && dn.textContent === '23';
        });
      if (!cells.length) return 'no cell for the 23rd';
      cells[0].click();
      var t = document.getElementById('view').textContent;
      return 'Team Standup=' + (t.indexOf('Team Standup') !== -1) +
             ' 1:1 with David=' + (t.indexOf('1:1 with David') !== -1);
    });
    ok('clicking a calendar day opens that day\'s events in the agenda',
       (function () {
         var t = document.getElementById('view').textContent;
         return t.indexOf('Team Standup') !== -1 && t.indexOf('1:1 with David') !== -1;
       })());

    tryRun('calendar event click opens the full event detail', function () {
      window.$.clear(document.getElementById('modal-root'));
      var ev = document.querySelector('#view .cal-event');
      if (!ev) return 'no event in the agenda';
      ev.click();
      var head = document.querySelector('#modal-root .modal-head h2');
      return 'modal title=' + (head ? head.textContent : 'NONE');
    });
    ok('clicking a calendar event opens a full-content event detail modal',
       (function () {
         var txt = document.getElementById('modal-root').textContent;
         return document.querySelectorAll('#modal-root .modal').length === 1 &&
                (txt.indexOf('Participants') !== -1 || txt.indexOf('Location') !== -1);
       })());

    function g_cellsAreIso(g) {
      if (!g || !g.cells) return false;
      return g.cells.every(function (c) {
        return c === null || /^\d{4}-\d{2}-\d{2}$/.test(c);
      });
    }

    /* ============================================================
       Settings + Logout. Settings renders inside the
       authenticated shell from the real session/profile
       sources; the shared Sign Out clears the demo session,
       returns to Welcome, and the auth gate keeps protected
       views (and the browser Back button) from resuming the
       authenticated shell. */

    /* ---------- Settings ---------- */
    tryRun('settings route renders inside the authenticated shell', function () {
      window.$.clear(document.getElementById('modal-root'));
      window.DemoAuth.continueDemo();
      window.location.hash = '#/settings';
      window.App.render();
      var root = document.getElementById('view');
      var head = root.querySelector('.page-head h1');
      return 'blocks=' + root.children.length +
             ' title=' + (head ? head.textContent : 'NONE');
    });
    ok('Settings opens inside the authenticated shell with the six sections',
       (function () {
         var t = document.getElementById('view').textContent;
         return t.indexOf('Profile') !== -1 &&
                t.indexOf('Account & Security') !== -1 &&
                t.indexOf('Notifications') !== -1 &&
                t.indexOf('Email') !== -1 &&
                t.indexOf('AI & Privacy') !== -1 &&
                t.indexOf('Data') !== -1;
       })());
    ok('Settings displays the real signed-in identity and profile from the existing sources',
       (function () {
         var s = window.DemoAuth.session();
         var u = window.Store.user();
         var t = document.getElementById('view').textContent;
         return !!s && t.indexOf(s.name) !== -1 &&
                t.indexOf(s.email) !== -1 &&
                t.indexOf(u.timezone.replace('_', ' ')) !== -1 &&
                t.indexOf('Demo session') !== -1;
       })(),
       'session=' + (window.DemoAuth.session() ? window.DemoAuth.session().email : 'none'));
    ok('Settings marks unimplemented notification preferences as coming soon (no fake switches)',
       (function () {
         return document.getElementById('view').textContent.indexOf('coming soon') !== -1;
       })());
    ok('Settings offers a Sign Out control in Account & Security',
       (function () {
         var btns = Array.prototype.map.call(
           document.querySelectorAll('#view .btn'), function (b) { return b.textContent; });
         return btns.indexOf('Sign Out') !== -1;
       })());
    tryRun('settings navigation away and back works', function () {
      window.location.hash = '#/command';
      window.App.render();
      var cmd = document.getElementById('view').children.length;
      window.location.hash = '#/settings';
      window.App.render();
      var set = document.getElementById('view').textContent.indexOf('Profile') !== -1;
      return 'commandBlocks=' + cmd + ' settingsProfile=' + set;
    });
    ok('navigating away from Settings and back preserves the Settings view',
       (function () {
         var t = document.getElementById('view').textContent;
         return t.indexOf('Profile') !== -1 && t.indexOf('Account & Security') !== -1;
       })());

    /* ---------- Logout ---------- */
    /* Snapshot the demo data so the post-sign-out check can
       prove sign-out left it untouched. Absolute seed counts
       drift earlier in the suite (tasks are created/edited),
       so the correct assertion is "unchanged by sign-out". */
    var dataBeforeSignOut = {
      tasks: window.Store.tasks().length,
      emails: window.Store.emails().length
    };
    tryRun('logout: Sign Out from Settings shows a confirmation', function () {
      window.$.clear(document.getElementById('modal-root'));
      window.location.hash = '#/settings';
      window.App.render();
      var out = Array.prototype.filter.call(
        document.querySelectorAll('#view .btn'), function (b) { return b.textContent === 'Sign Out'; })[0];
      if (!out) return 'no Sign Out button';
      out.click();
      var foot = Array.prototype.map.call(
        document.querySelectorAll('#modal-root .modal-foot .btn'), function (b) { return b.textContent; });
      return 'modalOpen=' + (document.querySelectorAll('#modal-root .modal').length === 1) +
             ' foot=[' + foot.join('/') + ']';
    });
    ok('Sign Out asks for confirmation with Cancel and Sign out',
       (function () {
         var txt = document.getElementById('modal-root').textContent;
         var foot = Array.prototype.map.call(
           document.querySelectorAll('#modal-root .modal-foot .btn'), function (b) { return b.textContent; });
         return txt.indexOf('Are you sure you want to sign out?') !== -1 &&
                foot.indexOf('Cancel') !== -1 &&
                foot.indexOf('Sign out') !== -1;
       })());
    tryRun('logout: cancelling the confirmation keeps the session', function () {
      var cancel = Array.prototype.filter.call(
        document.querySelectorAll('#modal-root .modal-foot .btn'), function (b) { return b.textContent === 'Cancel'; })[0];
      if (!cancel) return 'no Cancel button';
      cancel.click();
      return 'signedIn=' + window.DemoAuth.isSignedIn() +
             ' modalClosed=' + (document.querySelectorAll('#modal-root .modal').length === 0);
    });
    ok('cancelling the sign-out confirmation keeps the user signed in',
       window.DemoAuth.isSignedIn() === true);
    tryRun('logout: confirming clears the session and returns to Welcome', function () {
      var before = window.DemoAuth.isSignedIn();
      window.$.clear(document.getElementById('modal-root'));
      window.location.hash = '#/settings';
      window.App.render();
      var out = Array.prototype.filter.call(
        document.querySelectorAll('#view .btn'), function (b) { return b.textContent === 'Sign Out'; })[0];
      if (!out) return 'no Sign Out button (signedIn=' + before + ')';
      out.click();
      var confirm = Array.prototype.filter.call(
        document.querySelectorAll('#modal-root .modal-foot .btn'), function (b) { return b.textContent === 'Sign out'; })[0];
      if (!confirm) return 'no Sign out confirm button';
      confirm.click();
      return 'before=' + before +
             ' after=' + window.DemoAuth.isSignedIn() +
             ' route=' + window.App.route().path +
             ' storageCleared=' + (window.localStorage.getItem(window.DemoAuth.KEY) === null);
    });
    ok('confirming Sign Out clears the actual demo session',
       window.DemoAuth.isSignedIn() === false);
    ok('confirming Sign Out removes the session from storage',
       window.localStorage.getItem(window.DemoAuth.KEY) === null);
    ok('confirming Sign Out redirects to the Welcome / Sign-In experience',
       window.App.route().path === '/welcome');
    ok('the authenticated shell is not usable after sign out (protected route redirects to Sign In)',
       (function () {
         window.location.hash = '#/command';
         window.App.render();
         return window.App.route().path === '/signin';
       })());
    ok('browser Back after sign out cannot resume the authenticated shell',
       (function () {
         /* navigate back to a previously-visited protected route while signed out */
         window.location.hash = '#/settings';
         window.App.render();
         return window.App.route().path === '/signin';
       })());
    ok('signing out does not delete the underlying demo data or seed',
       window.Store.tasks().length === dataBeforeSignOut.tasks &&
       window.Store.emails().length === dataBeforeSignOut.emails,
       'tasks=' + window.Store.tasks().length + ' (was ' + dataBeforeSignOut.tasks +
       ') emails=' + window.Store.emails().length + ' (was ' + dataBeforeSignOut.emails + ')');

    /* ---------- Regression: existing features still work ---------- */
    window.DemoAuth.continueDemo();
    tryRun('regression: Inbox opens a message through the Details popup', function () {
      window.$.clear(document.getElementById('modal-root'));
      window.location.hash = '#/mail';
      window.App.render();
      var e = window.Store.email('m01');
      var row = Array.prototype.filter.call(
        document.querySelectorAll('#view .email-row'), function (r) {
          var t = r.querySelector('.t');
          return t && t.textContent === e.subject;
        })[0];
      if (!row) return 'no row for ' + e.subject;
      row.click();
      return 'popup=' + (document.querySelectorAll('#modal-root .modal').length === 1) +
             ' sender=' + (document.getElementById('modal-root').textContent.indexOf('John Miller') !== -1);
    });
    ok('Inbox still opens messages through the Details popup',
       document.querySelectorAll('#modal-root .modal').length === 1 &&
       document.getElementById('modal-root').textContent.indexOf('John Miller') !== -1);
    window.$.clear(document.getElementById('modal-root'));
    ok('email classification still works',
       (function () {
         var r = window.Store.mut.setEmailCategory('m02', 'Important');
         var good = r.ok && window.Store.emailCategory('m02') === 'Important';
         window.Store.mut.clearEmailCategory('m02');
         return good && window.Store.emailCategory('m02') === null;
       })());
    ok('suspicious email remains protected (cannot be reclassified out of Suspicious)',
       (function () {
         var r = window.Store.mut.setEmailCategory('m10', 'Low Priority');
         return r.ok === false &&
                window.EnginesMail.classify(window.Store.email('m10')).category === 'Suspicious';
       })());
    ok('Calendar still works', (function () {
      window.location.hash = '#/calendar'; window.App.render();
      return document.getElementById('view').textContent.indexOf('September 2026') !== -1;
    })());
    ok('Command Center still works', (function () {
      window.location.hash = '#/command'; window.App.render();
      return document.getElementById('view').children.length > 0;
    })());
    ok('My Day still works', (function () {
      window.location.hash = '#/day'; window.App.render();
      return document.getElementById('view').children.length > 0;
    })());
    ok('Tasks still work', (function () {
      var t = window.Store.activeTasks()[0];
      if (!t) return false;
      window.$.clear(document.getElementById('modal-root'));
      window.location.hash = '#/tasks/' + t.id; window.App.render();
      return document.querySelectorAll('#modal-root .modal').length === 1 &&
             document.getElementById('modal-root').textContent.indexOf(t.title) !== -1;
    })());
    window.$.clear(document.getElementById('modal-root'));
    ok('existing application navigation still works', (function () {
      var paths = ['#/command', '#/day', '#/mail', '#/calendar'];
      return paths.every(function (h) {
        window.location.hash = h;
        window.App.render();
        return document.getElementById('view').children.length > 0;
      });
    })());

    /* Production adapter contract tests (async). They run
       after the synchronous suite and settle before the
       summary is rendered. A rejection here is a real test
       failure, so it is recorded — a silent rejection would
       otherwise render "ALL PASS" with steps skipped. */
    productionAuthTests()
      .then(deploymentConfigWiringTests)
      .then(finish, function (e) {
        fails++;
        lines.push('THROW async production adapter / config wiring tests :: ' +
          (e && e.message ? e.message : String(e)));
        finish();
      });
  } catch (e) {
    lines.push('FATAL ' + e.message + ' @ ' + (e.stack || '').split('\n')[1]);
    lines.push('ALL PASS (false)');
    finish();
  }

  /* Safety net: if an async test never settles, still render. */
  setTimeout(finish, 4000);
})();

</script>
</body>
</html>
