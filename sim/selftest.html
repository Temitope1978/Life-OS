<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life OS — Self-test</title>
<link rel="stylesheet" href="assets/css/app.css">
<style>
  body { background: #0f0d17; color: #e8e6f0; font-family: Inter, system-ui, sans-serif; padding: 24px; }
  h1 { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 20px; margin: 0 0 4px; }
  p.lede { color: #a49fc0; margin: 0 0 20px; font-size: 14px; }
  pre#out { background: #17141f; border: 1px solid #2a2438; border-radius: 12px; padding: 16px;
            font-size: 12px; line-height: 1.6; white-space: pre-wrap; max-height: 78vh; overflow: auto; }
  .bar { margin-top: 16px; font-size: 13px; font-weight: 600; }
  .bar.ok { color: #34d399; } .bar.bad { color: #f87171; }
</style>
</head>
<body>
<h1>Life OS — Self-test</h1>
<p class="lede">Deterministic browser test suite. Open this file directly (no build step, no server).
Every assertion runs against the same seed and fixed date, 2026-09-22.</p>
<div id="view" style="display:none"></div>
<div id="modal-root"></div>
<div id="toasts"></div>
<pre id="out">Running&hellip;</pre>
<div class="bar" id="bar">&nbsp;</div>
<script src="assets/js/data/seed.js"></script>
<script src="assets/js/core/dates.js"></script>
<script src="assets/js/core/seam.js"></script>
    <script src="assets/js/core/store.js"></script>
    <script src="assets/js/core/actions.js"></script>
    <script src="assets/js/core/config.js"></script>
    <script src="assets/js/core/providers.js"></script>
    <script src="assets/js/core/oauth.js"></script>
<script src="assets/js/core/demo-auth.js"></script>
<script src="assets/js/engines/mail.js"></script>
<script src="assets/js/engines/commitment.js"></script>
<script src="assets/js/engines/priority.js"></script>
<script src="assets/js/engines/tasks.js"></script>
<script src="assets/js/engines/followup.js"></script>
<script src="assets/js/engines/forgetting.js"></script>
<script src="assets/js/engines/search.js"></script>
<script src="assets/js/engines/briefing.js"></script>
<script src="assets/js/ui/dom.js"></script>
    <script src="assets/js/ui/components.js"></script>
    <script src="assets/js/core/details.js"></script>
    <script src="assets/js/ui/views/command.js"></script>
<script src="assets/js/ui/views/day.js"></script>
<script src="assets/js/ui/views/mail.js"></script>
<script src="assets/js/ui/views/calendar.js"></script>
<script src="assets/js/ui/views/meetings.js"></script>
<script src="assets/js/ui/views/forget.js"></script>
<script src="assets/js/ui/views/search.js"></script>
<script src="assets/js/ui/views/commitments.js"></script>
<script src="assets/js/ui/views/control.js"></script>
<script src="assets/js/ui/views/auth.js"></script>
<script src="assets/js/app.js"></script>
<script>

(function () {
  var lines = [], fails = 0;
  function ok(name, cond, extra) {
    if (!cond) fails++;
    lines.push((cond ? 'PASS ' : 'FAIL ') + name + (extra ? ' :: ' + extra : ''));
  }
  function tryRun(name, fn) {
    try { var v = fn(); lines.push('RUN  ' + name + ' :: ' + v); return v; }
    catch (e) {
      fails++;
      lines.push('THROW ' + name + ' :: ' + e.message);
      lines.push('      ' + String(e.stack || '').split('\n').slice(0, 4).join(' | '));
      return null;
    }
  }

  try {
    ok('window.SEED', !!window.SEED);
    ok('window.D', !!window.D, 'today=' + window.D.today());
    ok('window.Store', !!window.Store);
    ok('window.App', !!window.App);

    /* app.js defers boot to DOMContentLoaded, which has not fired inside this
       inline script ΓÇö boot explicitly, then assert the shell rendered. */
    tryRun('boot render', function () {
      window.App.boot();
      return document.getElementById('view').children.length + ' blocks';
    });
    ok('view rendered', document.getElementById('view').children.length > 0,
       document.getElementById('view').children.length + ' children');

    /* ============================================================
       Demo authentication (assessment-safe). A clearly-labelled
       DEMO sign-in/sign-up layer — NOT real auth. No password is
       stored anywhere; it is validated in memory only. Supabase
       Auth is NOT activated. A demo session is established here so
       the downstream route loop (below) renders every real view. */
    var TEST_PW = 'Demo' + 'Password' + '123!';

    tryRun('welcome screen loads', function () {
      window.location.hash = '#/welcome';
      window.App.render();
      var root = document.getElementById('view');
      return root.children.length + ' blocks';
    });
    ok('welcome screen loads with branding, Sign In, Create Account and demo note',
       (function () {
         var t = document.getElementById('view').textContent;
         return t.indexOf('AI Life OS') !== -1 &&
                t.indexOf('Your Personal AI Chief of Staff') !== -1 &&
                t.indexOf('Remember less. Organize less. Get more done.') !== -1 &&
                t.indexOf('Sign In') !== -1 &&
                t.indexOf('Create Account') !== -1 &&
                t.indexOf('Continue as Demo') !== -1 &&
                t.indexOf('Demo Environment') !== -1;
       })());

    tryRun('sign in screen loads', function () {
      window.location.hash = '#/signin';
      window.App.render();
      return document.getElementById('view').children.length + ' blocks';
    });
    ok('sign in screen loads with email + password fields and demo note',
       (function () {
         var root = document.getElementById('view');
         var types = Array.prototype.map.call(root.querySelectorAll('input'), function (i) { return i.type; });
         return types.indexOf('email') !== -1 && types.indexOf('password') !== -1 &&
                root.textContent.indexOf('Sign In') !== -1 &&
                root.textContent.indexOf('Demo Environment') !== -1;
       })());

    tryRun('sign up screen loads', function () {
      window.location.hash = '#/signup';
      window.App.render();
      return document.getElementById('view').children.length + ' blocks';
    });
    ok('sign up screen loads with name, email, password, confirm and demo note',
       (function () {
         var root = document.getElementById('view');
         var types = Array.prototype.map.call(root.querySelectorAll('input'), function (i) { return i.type; });
         var emails = types.filter(function (t) { return t === 'email'; }).length;
         var pws = types.filter(function (t) { return t === 'password'; }).length;
         var labels = Array.prototype.map.call(root.querySelectorAll('label'), function (l) { return l.textContent; });
         return emails === 1 && pws === 2 &&
                labels.indexOf('Full Name') !== -1 &&
                labels.indexOf('Email Address') !== -1 &&
                labels.indexOf('Password') !== -1 &&
                labels.indexOf('Confirm Password') !== -1 &&
                root.textContent.indexOf('Create Account') !== -1 &&
                root.textContent.indexOf('Demo Environment') !== -1;
       })());

    /* Validation: required fields, email format, password match, min length. */
    ok('sign up validation: required fields are enforced',
       (function () {
         var r = window.DemoAuth.validateSignUp({ name: '', email: '', password: '', confirm: '' });
         return !r.ok && r.errors.length >= 4;
       })());
    ok('sign up validation: invalid email is rejected',
       (function () {
         var r = window.DemoAuth.validateSignUp({ name: 'A B', email: 'not-an-email', password: TEST_PW, confirm: TEST_PW });
         return !r.ok && r.errors.some(function (e) { return /valid email/i.test(e); });
       })());
    ok('sign up validation: password confirmation mismatch is rejected',
       (function () {
         var r = window.DemoAuth.validateSignUp({ name: 'A B', email: 'a@b.co', password: TEST_PW, confirm: 'Different' + 'Password' + '123!' });
         return !r.ok && r.errors.some(function (e) { return /do not match/i.test(e); });
       })());
    ok('sign up validation: short password is rejected',
       (function () {
         var r = window.DemoAuth.validateSignUp({ name: 'A B', email: 'a@b.co', password: 'short', confirm: 'short' });
         return !r.ok && r.errors.some(function (e) { return /at least/i.test(e); });
       })());
    ok('sign in validation: invalid email and short password are rejected',
       (function () {
         var r = window.DemoAuth.validateSignIn({ email: 'nope', password: 'x' });
         return !r.ok && r.errors.length >= 2;
       })());

    /* Sign up creates a demo session; the password is never persisted. */
    tryRun('demo sign up creates a session', function () {
      var r = window.DemoAuth.signUp({ name: 'Assessment Tester', email: 'assessor@demo.lifeos', password: TEST_PW, confirm: TEST_PW });
      return r.ok ? 'session=' + r.session.email : 'FAILED: ' + r.errors.join('; ');
    });
    ok('demo sign up creates an active demo session', window.DemoAuth.isSignedIn() === true);
    ok('demo session stores only non-sensitive fields (no password, no token)',
       (function () {
         var s = window.DemoAuth.session();
         var keys = s ? Object.keys(s) : [];
         return keys.indexOf('password') === -1 && keys.indexOf('token') === -1 &&
                keys.indexOf('secret') === -1 && keys.indexOf('userId') !== -1 &&
                keys.indexOf('name') !== -1 && keys.indexOf('email') !== -1 &&
                keys.indexOf('authState') !== -1;
       })());
    ok('password is never persisted to localStorage or sessionStorage',
       (function () {
         var stores = [window.localStorage, window.sessionStorage];
         for (var i = 0; i < stores.length; i++) {
           var st = stores[i];
           for (var j = 0; j < st.length; j++) {
             var k = st.key(j);
             var v = st.getItem(k);
             if ((k && k.indexOf(TEST_PW) !== -1) || (v && v.indexOf(TEST_PW) !== -1)) return false;
           }
         }
         return true;
       })());

    /* Direct route protection: unauthenticated #/command redirects to Sign In. */
    tryRun('unauthenticated #/command redirects to sign in', function () {
      window.DemoAuth.clear();
      window.location.hash = '#/command';
      window.App.render();
      return window.App.route().path;
    });
    ok('unauthenticated #/command redirects to #/signin', window.App.route().path === '/signin');

    /* Demo sign-in reaches the existing Command Center, unchanged. */
    tryRun('demo sign in reaches the Command Center', function () {
      var r = window.DemoAuth.signIn({ email: 'assessor@demo.lifeos', password: TEST_PW });
      if (!r.ok) return 'sign in failed: ' + r.errors.join('; ');
      window.location.hash = '#/command';
      window.App.render();
      var root = document.getElementById('view');
      return root.children.length + ' blocks';
    });
    ok('signed-in #/command opens the existing Command Center (greeting + priority cards)',
       (function () {
         var t = document.getElementById('view').textContent;
         return t.indexOf('Good ') !== -1 && t.indexOf('Priority items') !== -1 &&
                window.DemoAuth.isSignedIn() === true;
       })());
    ok('Command Center remains functional after sign-in',
       window.EnginesBriefing.build().stats.meetings === 3 &&
       window.EnginesPriority.priorityItems().length === 4);
    ok('Action Authorization Layer is unchanged by the demo session',
       window.Actions.decide({ type: 'send_external_email', recipient: 'x@y.com' }, window.Store.user()).mode === 'approve');
    ok('providers remain in demo mode (provider/OAuth architecture unchanged)',
       window.Providers.demoMode() === true);

    /* Forgot Password? must not pretend to send a real email. */
    tryRun('forgot password shows the demo recovery message', function () {
      window.location.hash = '#/signin';
      window.App.render();
      var btns = Array.prototype.filter.call(document.querySelectorAll('#view .btn'), function (b) { return b.textContent === 'Forgot Password?'; });
      if (!btns.length) return 'no Forgot Password? button';
      btns[0].click();
      var toast = document.querySelector('#toasts .toast');
      return toast ? toast.textContent : 'NO TOAST';
    });
    ok('forgot password never pretends to send a real email',
       (function () {
         var toast = document.querySelector('#toasts .toast');
         return !!toast && toast.textContent.indexOf('secure account authentication is connected') !== -1;
       })());

    /* Continue as Demo: one-click demo session with no password involved. */
    tryRun('continue as demo creates a password-free session', function () {
      window.DemoAuth.signOut();
      var r = window.DemoAuth.continueDemo();
      return r.ok ? 'session=' + r.session.email : 'FAILED';
    });
    ok('continue as demo signs in without any password',
       window.DemoAuth.isSignedIn() === true &&
       window.DemoAuth.session().email === 'demo@lifeos.local');

    var seedCounts = 'contacts=' + window.Store.contacts().length +
      ' emails=' + window.Store.emails().length +
      ' events=' + window.Store.events().length +
      ' meetings=' + window.Store.meetings().length +
      ' commitments=' + window.Store.commitments().length +
      ' tasks=' + window.Store.tasks().length +
      ' followUps=' + window.Store.followUps().length +
      ' docs=' + window.Store.documents().length +
      ' integrations=' + window.Store.integrations().length +
      ' reminders=' + window.SEED.reminders.length;
    lines.push('SEED ' + seedCounts);
    ok('6 contacts', window.Store.contacts().length === 6);
    ok('24 emails', window.Store.emails().length === 24);
    ok('6 events', window.Store.events().length === 6);
    ok('3 meetings', window.Store.meetings().length === 3);
    ok('7 commitments', window.Store.commitments().length === 7);
    ok('15 tasks', window.Store.tasks().length === 15);
    ok('4 follow-ups', window.Store.followUps().length === 4);
    ok('4 documents', window.Store.documents().length === 4);
    ok('4 integrations', window.Store.integrations().length === 4);
    ok('3 reminders', window.SEED.reminders.length === 3);

    tryRun('events today', function () { return window.EnginesTasks.eventsToday().map(function (e) { return e.title; }).join(' | '); });
    ok('3 meetings today', window.EnginesTasks.eventsToday().length === 3);
    ok('1 conflict today', window.EnginesTasks.conflicts().length === 1,
       JSON.stringify(window.EnginesTasks.conflicts().map(function (c) { return c.a.title + '/' + c.b.title; })));
    ok('1 meeting needs prep', window.EnginesTasks.needsPrep().length === 1);

    var ranked = window.EnginesPriority.ranked();
    tryRun('priority ranking', function () {
      return ranked.slice(0, 6).map(function (r) { return r.task.id + '=' + r.score + '/' + r.band; }).join(' ');
    });
    ok('score bands match spec (high>=60, medium>=30)',
       ranked.every(function (r) {
         return (r.band === 'high') === (r.score >= 60) &&
                (r.band === 'medium') === (r.score >= 30 && r.score < 60);
       }),
       ranked.slice(0, 6).map(function (r) { return r.task.id + '=' + r.score + '/' + r.band; }).join(' '));
    ok('every score is explained', ranked.every(function (r) {
         return r.score === 0 || r.factors.length > 0;
       }));
    ok('blocked tasks are flagged, not deprioritised',
       ranked.filter(function (r) { return r.task.blockedBy; })
             .every(function (r) { return r.factors.some(function (f) { return /Blocked/.test(f.why); }); }));
    var highs = window.EnginesPriority.priorityItems();
    ok('4 priority items on the Command Center', highs.length === 4,
       'got ' + highs.length + ' -> ' + highs.map(function (r) { return r.task.id + ':' + r.band; }).join(','));
    ok('top item is blocked proposal', ranked[0].task.id === 't1', ranked[0].task.id);
    tryRun('dependency insight', function () { return window.EnginesTasks.dependencyInsight(ranked[0].task).text; });

    var buckets = window.EnginesMail.byCategory();
    tryRun('mail categories', function () {
      return Object.keys(buckets).map(function (k) { return k + ':' + buckets[k].length; }).join(' ');
    });
    ok('all 8 categories present', Object.keys(buckets).every(function (k) { return buckets[k].length > 0; }),
       Object.keys(buckets).map(function (k) { return k + '=' + buckets[k].length; }).join(' '));
    ok('suspicious email detected', buckets['Suspicious'].length === 1,
       buckets['Suspicious'].map(function (r) { return r.email.id; }).join(','));
    ok('suspicious email is m10', buckets['Suspicious'].length === 1 && buckets['Suspicious'][0].email.id === 'm10');
    ok('suspicious is never actionable', buckets['Suspicious'][0].actionRequired === false);
    ok('urgent = deadline today', buckets['Urgent'].length === 1 && buckets['Urgent'][0].email.id === 'm11',
       buckets['Urgent'].map(function (r) { return r.email.id; }).join(','));
    ok('action required includes m02/m04', ['m02', 'm04'].every(function (id) {
         return buckets['Action Required'].some(function (r) { return r.email.id === id; }); }));
    ok('m01 waiting on us', buckets['Waiting'].some(function (r) { return r.email.id === 'm01'; }));
    ok('newsletter not actionable', buckets['Newsletter'].every(function (r) { return !r.actionRequired; }));
    ok('promotion not actionable', buckets['Promotion'].every(function (r) { return !r.actionRequired; }));

    var fgt = window.EnginesForgetting.detect();
    tryRun('forgetting detect', function () {
      return fgt.map(function (f) { return f.rule + ':' + f.title; }).join(' || ');
    });
    var rules = {};
    fgt.forEach(function (f) { rules[f.rule] = (rules[f.rule] || 0) + 1; });
    ok('F-1 overdue promise detected', !!rules['F-1'], JSON.stringify(rules));
    ok('F-2 imminent meeting promise detected', !!rules['F-2'], JSON.stringify(rules));
    ok('F-3 unprepared meeting detected', !!rules['F-3'], JSON.stringify(rules));
    ok('F-6 stale waiting task detected', !!rules['F-6'], JSON.stringify(rules));
    ok('F-6 not a duplicate of F-1',
       !fgt.some(function (f) { return f.rule === 'F-6' && f.contactId === 'c1'; }),
       fgt.map(function (f) { return f.rule + '/' + f.contactId; }).join(' '));
    ok('forgetting titles drop the recipient name',
       !fgt.some(function (f) { return /\bto [A-Z][a-z]+$/.test(f.title); }),
       fgt.map(function (f) { return f.rule + ': ' + f.title; }).join(' || '));
    ok('every result is traceable', fgt.every(function (f) { return !!f.source; }));
    ok('forgetting dates stay in the past',
       fgt.every(function (f) { return !f.daysOverdue || f.daysOverdue < 1000; }),
       fgt.map(function (f) { return f.rule + '/' + (f.daysOverdue || 0) + 'd'; }).join(' '));

    var brief = window.EnginesBriefing.build();
    tryRun('briefing lead', function () { return brief.lead; });
    ok('briefing stats meetings=3', brief.stats.meetings === 3);

    tryRun('search "pricing"', function () { return window.EnginesSearch.query('pricing', 5).map(function (d) { return d.kind; }).join(','); });
    ok('search finds results', window.EnginesSearch.query('pricing', 5).length > 0);
    tryRun('answer "What did I promise John?"', function () { return window.EnginesBriefing.answer('What did I promise John?').html; });
    tryRun('answer "Who am I waiting for?"', function () { return window.EnginesBriefing.answer('Who am I waiting for?').list.length; });
    tryRun('answer "What am I forgetting?"', function () { return window.EnginesBriefing.answer('What am I forgetting?').list.length; });
    tryRun('answer "What are my deadlines this week?"', function () { return window.EnginesBriefing.answer('What are my deadlines this week?').list.length; });

    var ov = window.EnginesFollowUp.overdue();
    tryRun('overdue follow-ups', function () { return ov.map(function (f) { return f.id + ':' + f.subject; }).join(','); });
    ok('1 overdue follow-up', ov.length === 1, 'got ' + ov.length);
    ok('unconfirmed commitments exist',
       window.EnginesCommitment.userOwed().filter(function (k) { return !k.confirmedByUser; }).length > 0);
    ok('possible commitment k7 is possible',
       (window.Store.commitment('k7') || {}).certainty === 'possible');

    tryRun('meeting extraction m1', function () {
      return window.EnginesCommitment.extractForMeeting(window.Store.meeting('m1')).map(function (c) {
        return c.direction + '|' + (c.dueDate || 'none') + '|' + c.certainty + '|' + c.description;
      }).join('\n    ');
    });

    /* Drive the real router rather than calling views directly, so hash parsing,
       the render switch and nav state are all covered. */
    ['/command', '/day', '/mail', '/calendar', '/meetings', '/forget', '/search',
     '/commitments', '/waiting', '/control', '/mail/m10', '/meetings/m1',
     '/tasks/t1', '/contacts/c1', '/documents/d1'].forEach(function (p) {
      tryRun('route ' + p, function () {
        window.location.hash = '#' + p;
        window.App.render();
        var root = document.getElementById('view');
        var modals = document.querySelectorAll('#modal-root .modal').length;
        var detail = /^\/(tasks|contacts|documents)/.test(p);
        if (detail && !modals) return 'THREW silently (no modal)';
        if (!detail && !root.children.length) return 'EMPTY VIEW';
        return root.children.length + ' blocks, ' + modals + ' modal';
      });
      var rendered = document.getElementById('view').textContent + document.getElementById('modal-root').textContent;
      ok('route ' + p + ' has no stringified nodes', rendered.indexOf('[object') === -1);
      ok('route ' + p + ' has no undefined leaks', !/\bundefined\b|\bNaN\b/.test(rendered));
      window.$.clear(document.getElementById('modal-root'));
    });

    ok('suspicious email never creates a task',
       window.EnginesForgetting.detect().every(function (f) { return !/fgt-mail-m10/.test(f.id); }));

    tryRun('deep link #/mail/m10', function () {
      window.location.hash = '#/mail/m10';
      window.App.render();
      var t = document.getElementById('view').textContent;
      return (t.indexOf('Held for your review') !== -1 ? 'held-banner shown' : 'NO BANNER');
    });

    /* hashchange is async, so render synchronously after navigation */
    tryRun('open suspicious email detail', function () {
      window.ViewMail.open('m10');
      window.App.render();
      var root = document.getElementById('view');
      return (root.textContent.indexOf('Held for your review') !== -1 ? 'held-banner ' : 'NO-BANNER ') +
             root.querySelectorAll('.chip').length + ' chips';
    });
    ok('suspicious detail offers no reply or task action',
       (function () {
         var labels = Array.prototype.map.call(document.querySelectorAll('#view .actions .btn'), function (b) { return b.textContent; });
         return labels.indexOf('Reply') === -1 && labels.indexOf('Add task') === -1 &&
                labels.indexOf('This is a scam') !== -1;
       })(),
       Array.prototype.map.call(document.querySelectorAll('#view .actions .btn'), function (b) { return b.textContent; }).join('/'));
    tryRun('reply draft modal', function () {
      window.ViewMail.open('m11');
      window.App.render();
      var btn = Array.prototype.filter.call(document.querySelectorAll('#view .btn'), function (b) { return b.textContent === 'Reply'; })[0];
      if (!btn) return 'no Reply button';
      btn.click();
      return document.querySelectorAll('#modal-root .modal').length + ' modal';
    });
    tryRun('prepareAll modal', function () {
      window.$.clear(document.getElementById('modal-root'));
      window.App.prepareAll();
      return document.querySelectorAll('#modal-root .modal').length + ' modal';
    });
    tryRun('meeting briefing modal', function () {
      window.$.clear(document.getElementById('modal-root'));
      window.App.openEventBrief('e1');
      var txt = document.getElementById('modal-root').textContent;
      return ['Who is in the room', 'Suggested objectives', 'Do not forget'].filter(function (s) { return txt.indexOf(s) !== -1; }).join('+') || 'MISSING';
    });
    tryRun('transcript editor modal', function () {
      window.$.clear(document.getElementById('modal-root'));
      window.ViewMeetings.openTranscript('m1');
      return document.querySelectorAll('#modal-root textarea').length + ' editable turns';
    });
    /* Regression: detail-route modals (/tasks, /contacts, /documents)
       re-opened on Cancel because their onClose re-ran render(), which
       re-invoked the same detail route. Cancel must close the modal and
       leave the detail route. */
    tryRun('cancel closes the task modal', function () {
      window.$.clear(document.getElementById('modal-root'));
      window.location.hash = '#/tasks/t1';
      window.App.render();
      var opened = document.querySelectorAll('#modal-root .modal').length;
      var cancel = Array.prototype.filter.call(
        document.querySelectorAll('#modal-root .modal-foot .btn'),
        function (b) { return b.textContent === 'Cancel'; })[0];
      if (opened !== 1) return 'expected 1 modal, got ' + opened;
      if (!cancel) return 'no Cancel button';
      cancel.click();
      var stillOpen = document.querySelectorAll('#modal-root .modal').length;
      var path = window.App.route().path;
      if (stillOpen) return 'modal still open after Cancel';
      if (path === '/tasks') return 're-opened: still on /tasks';
      return 'closed, back on ' + path;
    });
    tryRun('cancel closes the document modal', function () {
      window.$.clear(document.getElementById('modal-root'));

    ok('authenticated #/command DOES contain the normal application shell',
       (function () {
         var s = shellState();
         return s.isAuth === false && (window.innerWidth <= 900 || s.sidebarDisplay !== 'none');
       })());

    /* ============================================================
       Real user-local date/time + true calendar month grid +
       full-content detail modals + manual action creation/editing.
       The seeded narrative stays anchored to the deterministic
       demo date (2026-09-22); the real-local clock and calendar
       are display-only. setRealToday pins the real date here so
       calendar assertions are reproducible (test-only). */
    ok('real-local clock: timezone is a non-empty IANA name',
       typeof window.D.timeZone() === 'string' && window.D.timeZone().length > 0 &&
       window.D.timeZone().indexOf('/') !== -1,
       window.D.timeZone());
    ok('real-local clock: timezone label resolves',
       typeof window.D.timeZoneLabel() === 'string' && window.D.timeZoneLabel().length > 0,
       window.D.timeZoneLabel());
    ok('real-local clock: realToday is a valid ISO date',
       /^\d{4}-\d{2}-\d{2}$/.test(window.D.realToday()),
       window.D.realToday());
    ok('real-local clock: localTime is HH:MM',
       /^\d{2}:\d{2}$/.test(window.D.localTime()),
       window.D.localTime());
    ok('real-local clock: realDateLong is non-empty',
       window.D.realDateLong().length > 0, window.D.realDateLong());
    ok('real-local clock: realDayName is a weekday',
       ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']
         .indexOf(window.D.realDayName()) !== -1,
       window.D.realDayName());
    ok('simulated date stays anchored to the seed (deterministic narrative)',
       window.D.today() === '2026-09-22', window.D.today());

    /* Calendar grid — September 2026: 30 days, starts Tuesday. */
    tryRun('buildMonth(2026-09-22)', function () {
      var g = window.D.buildMonth('2026-09-22');
      return 'year=' + g.year + ' month=' + g.month + ' startWeekday=' + g.startWeekday +
             ' daysInMonth=' + g.daysInMonth + ' cells=' + g.cells.length +
             ' today=' + g.todayIso;
    });
    ok('buildMonth: September 2026 has 30 days, correct start weekday and a whole-week grid',
       (function () {
         var g = window.D.buildMonth('2026-09-22');
         var first = new Date(2026, 8, 1);
         return g.year === 2026 && g.month === 8 && g.daysInMonth === 30 &&
                g.startWeekday === first.getDay() &&
                g.cells.length % 7 === 0 &&
                g.cells.length >= g.startWeekday + g.daysInMonth &&
                g.todayIso === '2026-09-22';
       })(),
       (function () { var g = window.D.buildMonth('2026-09-22'); return JSON.stringify(g); })());
    ok('buildMonth: leading blanks precede the 1st and the grid is fully padded',
       (function () {
         var g = window.D.buildMonth('2026-09-22');
         return g.cells.indexOf('2026-09-01') === g.startWeekday &&
                g.cells.filter(function (c) { return !c; }).length === g.cells.length - g.daysInMonth;
       })());
    ok('buildMonth: cells are ISO date strings, not day numbers',
       g_cellsAreIso(window.D.buildMonth('2026-09-22')));
    ok('buildMonth: leap-year February has 29 days (2024)',
       window.D.buildMonth('2024-02-15').daysInMonth === 29);
    ok('buildMonth: non-leap February has 28 days (2026)',
       window.D.buildMonth('2026-02-15').daysInMonth === 28);
    ok('buildMonth: month lengths are correct (Jan 31, Apr 30, Dec 31)',
       window.D.buildMonth('2026-01-15').daysInMonth === 31 &&
       window.D.buildMonth('2026-04-15').daysInMonth === 30 &&
       window.D.buildMonth('2026-12-15').daysInMonth === 31);
    ok('addMonths: previous and next month roll over correctly',
       window.D.addMonths('2026-09-22', -1) === '2026-08-22' &&
       window.D.addMonths('2026-09-22', 1) === '2026-10-22',
       window.D.addMonths('2026-09-22', -1) + ' / ' + window.D.addMonths('2026-09-22', 1));
    ok('addMonths: day is clamped to the target month length',
       window.D.addMonths('2026-03-31', -1) === '2026-02-28',
       window.D.addMonths('2026-03-31', -1));
    ok('monthDate: builds an ISO date from year, month and day parts',
       window.D.monthDate(2026, 8, 15) === '2026-09-15');
    ok('seeded events stay on their authored dates (calendar is never re-anchored)',
       window.EnginesTasks.eventsFor('2026-09-22').length === 3 &&
       window.EnginesTasks.eventsFor('2026-09-23').length === 3,
       '09-22=' + window.EnginesTasks.eventsFor('2026-09-22').length +
       ' 09-23=' + window.EnginesTasks.eventsFor('2026-09-23').length);

    /* Manual action creation with the full field set, persisted
       through the existing store (localStorage lifeos.sim.v1). */
    tryRun('manual action creation with all fields', function () {
      var before = window.Store.tasks().length;
      var t = window.Store.mut.createTask({
        title: 'Test action with details',
        description: 'A detailed description',
        dueDate: '2026-10-05',
        dueTime: '14:30',
        reminder: '2026-10-05T14:00',
        project: 'Client work',
        priority: 'high',
        status: 'Planned'
      });
      var after = window.Store.tasks().length;
      var s = window.Store.task(t.id);
      return before + '->' + after +
             ' desc=' + s.description + ' due=' + s.dueDate + ' ' + s.dueTime +
             ' rem=' + s.reminder + ' proj=' + s.project +
             ' prio=' + s.priority + ' status=' + s.status;
    });
    ok('manual action persists description, due date, due time, reminder, project, priority and status',
       (function () {
         var t = window.Store.tasks().filter(function (x) { return x.title === 'Test action with details'; })[0];
         return !!t && t.description === 'A detailed description' &&
                t.dueDate === '2026-10-05' && t.dueTime === '14:30' &&
                t.reminder === '2026-10-05T14:00' && t.project === 'Client work' &&
                t.priority === 'high' && t.status === 'Planned' && t.userCreated === true;
       })());
    ok('a manually created dated action appears in tasksFor on its calendar date',
       window.EnginesTasks.tasksFor('2026-10-05').some(function (x) { return x.title === 'Test action with details'; }));

    /* Action edit form — pre-filled, validated, persisted. */
    tryRun('action edit form opens pre-filled', function () {
      window.$.clear(document.getElementById('modal-root'));
      var t = window.Store.tasks().filter(function (x) { return x.title === 'Test action with details'; })[0];
      window.Details.openEditAction(t, {});
      var root = document.getElementById('modal-root');
      var titleInput = root.querySelector('input[type=text]');
      return 'title=' + (titleInput ? titleInput.value : 'NONE') +
             ' textareas=' + root.querySelectorAll('textarea').length +
             ' selects=' + root.querySelectorAll('select').length;
    });
    ok('action edit form has title, description, due date, due time, reminder, project, priority and status',
       (function () {
         var root = document.getElementById('modal-root');
         var titleInput = root.querySelector('input[type=text]');
         var dateInput = root.querySelector('input[type=date]');
         var timeInput = root.querySelector('input[type=time]');
         var remInput = root.querySelector('input[type=datetime-local]');
         var projInput = root.querySelector('input[list]');
         return !!titleInput && titleInput.value === 'Test action with details' &&
                dateInput.value === '2026-10-05' && timeInput.value === '14:30' &&
                remInput.value === '2026-10-05T14:00' && projInput.value === 'Client work' &&
                root.querySelectorAll('textarea').length === 1 &&
                root.querySelectorAll('select').length === 2 &&
                root.querySelectorAll('datalist').length === 1;
       })());
    tryRun('action edit saves changes', function () {
      var root = document.getElementById('modal-root');
      var titleInput = root.querySelector('input[type=text]');
      titleInput.value = 'Test action edited';
      var save = Array.prototype.filter.call(
        root.querySelectorAll('.modal-foot .btn'),
        function (b) { return b.textContent === 'Save changes'; })[0];
      if (!save) return 'no Save button';
      save.click();
      return 'edited present=' + window.Store.tasks().some(function (x) { return x.title === 'Test action edited'; });
    });
    ok('action edit persists the edited title',
       window.Store.tasks().some(function (x) { return x.title === 'Test action edited'; }) &&
       !window.Store.tasks().some(function (x) { return x.title === 'Test action with details'; }));
    tryRun('action form validation rejects an empty title', function () {
      window.$.clear(document.getElementById('modal-root'));
      var t = window.Store.tasks().filter(function (x) { return x.title === 'Test action edited'; })[0];
      window.Details.openEditAction(t, {});
      var root = document.getElementById('modal-root');
      root.querySelector('input[type=text]').value = '';
      var save = Array.prototype.filter.call(
        root.querySelectorAll('.modal-foot .btn'),
        function (b) { return b.textContent === 'Save changes'; })[0];
      save.click();
      var errBox = root.querySelector('.modal-body .alert-danger');
      return 'error=' + (errBox ? errBox.textContent : 'NONE') +
             ' modalsOpen=' + document.querySelectorAll('#modal-root .modal').length +
             ' titleStill=' + window.Store.task(t.id).title;
    });
    ok('action form validation: empty title is rejected inline and the modal stays open',
       (function () {
         var root = document.getElementById('modal-root');
         var errBox = root.querySelector('.modal-body .alert-danger');
         return document.querySelectorAll('#modal-root .modal').length === 1 &&
                !!errBox && /required/i.test(errBox.textContent) &&
                window.Store.tasks().some(function (x) { return x.title === 'Test action edited'; });
       })());

    /* Full-content detail modals for every object type. */
    tryRun('email detail modal shows full content', function () {
      window.$.clear(document.getElementById('modal-root'));
      window.Details.open({ kind: 'email', ref: 'm01' });
      return document.getElementById('modal-root').textContent.slice(0, 160);
    });
    ok('email detail shows sender, recipient, full body and timestamp',
       (function () {
         var txt = document.getElementById('modal-root').textContent;
         var e = window.Store.email('m01');
         var u = window.Store.user();
         return txt.indexOf(e.subject) !== -1 &&
                txt.indexOf('From') !== -1 && txt.indexOf(u.email) !== -1 &&
                txt.indexOf('finance team') !== -1 &&
                txt.indexOf(window.D.formatDateTime(e.received)) !== -1;
       })());

    tryRun('event detail modal shows full content', function () {
      window.$.clear(document.getElementById('modal-root'));
      window.Details.open({ kind: 'event', ref: 'e1' });
      return document.getElementById('modal-root').textContent.slice(0, 160);
    });
    ok('event detail shows date, time, location, participants and notes',
       (function () {
         var txt = document.getElementById('modal-root').textContent;
         var e = window.Store.event('e1');
         var names = e.attendeeIds.map(function (id) { return window.Store.contactName(id); }).join(', ');
         return txt.indexOf(e.title) !== -1 &&
                txt.indexOf(window.D.formatLong(e.date)) !== -1 &&
                txt.indexOf(e.start + '–' + e.end) !== -1 &&
                txt.indexOf(e.location) !== -1 &&
                txt.indexOf(names) !== -1 &&
                txt.indexOf(e.notes) !== -1;
       })());

    tryRun('task detail modal shows full content', function () {
      window.$.clear(document.getElementById('modal-root'));
      window.Details.open({ kind: 'task', ref: 't1' });
      return document.getElementById('modal-root').textContent.slice(0, 160);
    });
    ok('task detail shows title, status, Edit and an appropriate status action',
       (function () {
         var txt = document.getElementById('modal-root').textContent;
         var t = window.Store.task('t1');
         var labels = Array.prototype.map.call(
           document.querySelectorAll('#modal-root .modal-foot .btn'),
           function (b) { return b.textContent; });
         var expected = ['In Progress', 'Waiting', 'Completed']
           .filter(function (s) { return s !== t.status; });
         return txt.indexOf(t.title) !== -1 && txt.indexOf(t.status) !== -1 &&
                labels.indexOf('Edit') !== -1 &&
                expected.some(function (s) { return labels.indexOf(s) !== -1; });
       })());

    tryRun('commitment detail modal shows full content', function () {
      window.$.clear(document.getElementById('modal-root'));
      window.Details.open({ kind: 'commitment', ref: 'k1' });
      return document.getElementById('modal-root').textContent.slice(0, 160);
    });
    ok('commitment detail shows description, direction, person and due date',
       (function () {
         var txt = document.getElementById('modal-root').textContent;
         var k = window.Store.commitment('k1');
         var p = window.Store.contact(k.personId);
         return txt.indexOf(k.description) !== -1 &&
                txt.indexOf(window.EnginesCommitment.directionLabel(k.direction)) !== -1 &&
                txt.indexOf(p.name) !== -1 &&
                (k.dueDate ? txt.indexOf(window.D.formatDate(k.dueDate)) !== -1 : true);
       })());

    /* The calendar view renders a true month grid anchored to the
       (pinned) real local date, with today highlighted and event
       dots on the authored event dates. */
    window.D.setRealToday('2026-09-22');
    tryRun('calendar view renders a real month grid', function () {
      window.$.clear(document.getElementById('modal-root'));
      window.DemoAuth.continueDemo();
      window.location.hash = '#/calendar';
      window.App.render();
      var root = document.getElementById('view');
      var grid = root.querySelectorAll('.cal-grid .cal-cell').length;
      var wds = root.querySelectorAll('.cal-week .cal-wd').length;
      var title = root.querySelector('.cal-title');
      return 'cells=' + grid + ' weekdayHeaders=' + wds +
             ' title=' + (title ? title.textContent : 'NONE') +
             ' todayCells=' + root.querySelectorAll('.cal-cell.today').length +
             ' evDots=' + root.querySelectorAll('.cal-dot.ev').length;
    });
    ok('calendar renders the demo month (September 2026) with today highlighted and event dots',
       (function () {
         var root = document.getElementById('view');
         var title = root.querySelector('.cal-title');
         return !!title && title.textContent === 'September 2026' &&
                root.querySelectorAll('.cal-cell.today').length === 1 &&
                root.querySelectorAll('.cal-week .cal-wd').length === 7 &&
                root.querySelectorAll('.cal-dot.ev').length >= 3;
       })(),
       (function () { var t = document.querySelector('.cal-title'); return t ? t.textContent : 'NONE'; })());

    tryRun('calendar day click selects the day and shows its agenda', function () {
      var root = document.getElementById('view');
      var cells = Array.prototype.filter.call(
        root.querySelectorAll('.cal-cell'),
        function (c) {
          var dn = c.querySelector('.cal-dn');
          return dn && dn.textContent === '23';
        });
      if (!cells.length) return 'no cell for the 23rd';
      cells[0].click();
      var t = document.getElementById('view').textContent;
      return 'Team Standup=' + (t.indexOf('Team Standup') !== -1) +
             ' 1:1 with David=' + (t.indexOf('1:1 with David') !== -1);
    });
    ok('clicking a calendar day opens that day\'s events in the agenda',
       (function () {
         var t = document.getElementById('view').textContent;
         return t.indexOf('Team Standup') !== -1 && t.indexOf('1:1 with David') !== -1;
       })());

    tryRun('calendar event click opens the full event detail', function () {
      window.$.clear(document.getElementById('modal-root'));
      var ev = document.querySelector('#view .cal-event');
      if (!ev) return 'no event in the agenda';
      ev.click();
      var head = document.querySelector('#modal-root .modal-head h2');
      return 'modal title=' + (head ? head.textContent : 'NONE');
    });
    ok('clicking a calendar event opens a full-content event detail modal',
       (function () {
         var txt = document.getElementById('modal-root').textContent;
         return document.querySelectorAll('#modal-root .modal').length === 1 &&
                (txt.indexOf('Participants') !== -1 || txt.indexOf('Location') !== -1);
       })());

    function g_cellsAreIso(g) {
      if (!g || !g.cells) return false;
      return g.cells.every(function (c) {
        return c === null || /^\d{4}-\d{2}-\d{2}$/.test(c);
      });
    }

    lines.push('---');
    lines.push(fails === 0 ? 'ALL PASS' : (fails + ' FAILURE(S)'));
  } catch (e) {
    lines.push('FATAL ' + e.message + ' @ ' + (e.stack || '').split('\n')[1]);
    lines.push('ALL PASS (false)');
  }

  document.getElementById('out').textContent = lines.join('\n');
  var bar = document.getElementById('bar');
  bar.textContent = fails === 0 ? 'All checks passed' : fails + ' check(s) failed';
  bar.className = 'bar ' + (fails === 0 ? 'ok' : 'bad');
})();

</script>
</body>
</html>
